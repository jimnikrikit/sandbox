<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lodge — Los Altos Hills</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; image-rendering: pixelated; }

  body {
    background: #0a0a1a;
    font-family: 'Press Start 2P', monospace;
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  header {
    text-align: center;
    padding: 24px 16px 8px;
    background: linear-gradient(180deg, #0a0a1a 0%, transparent 100%);
    position: relative;
    z-index: 2;
  }

  header h1 {
    font-size: clamp(14px, 3vw, 22px);
    color: #ffdd57;
    text-shadow: 3px 3px #c8a000, 0 0 20px #ffaa00;
    letter-spacing: 2px;
  }

  header p {
    font-size: clamp(7px, 1.5vw, 10px);
    color: #aad4ff;
    margin-top: 10px;
    opacity: 0.8;
  }

  #scene-wrap {
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 16px;
    position: relative;
  }

  canvas#scene {
    display: block;
    image-rendering: pixelated;
    cursor: default;
    border: 4px solid #2a2a4a;
    box-shadow: 0 0 40px #3344aa88;
    max-width: 100%;
  }

  #game-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: #000000cc;
    z-index: 100;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #game-overlay.active { display: flex; }

  #game-wrap {
    position: relative;
    border: 4px solid #ffdd57;
    box-shadow: 0 0 30px #ffaa00;
  }

  canvas#game {
    display: block;
    image-rendering: pixelated;
    max-width: 95vw;
  }

  #game-ui {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 16px;
    background: #111;
    font-size: 9px;
    color: #ffdd57;
    gap: 24px;
  }

  #close-game {
    position: absolute;
    top: -14px;
    right: -14px;
    background: #cc2222;
    color: #fff;
    border: 3px solid #ff4444;
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    width: 28px;
    height: 28px;
    cursor: pointer;
    line-height: 1;
    padding: 0;
  }
  #close-game:hover { background: #ff2222; }

  #instructions {
    max-width: 600px;
    font-size: 8px;
    color: #aad4ff;
    text-align: center;
    padding: 12px;
    background: #111;
    border: 2px solid #2a2a4a;
    margin-top: 8px;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 8px;
    color: #445566;
  }

  #hint {
    font-size: 8px;
    color: #ffdd57;
    text-align: center;
    padding: 6px;
    animation: blink 1.4s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body>

<header>
  <h1>★ THE LODGE ★</h1>
  <p>Los Altos Hills, CA &nbsp;|&nbsp; A Home. A Legend.</p>
</header>

<div id="scene-wrap">
  <canvas id="scene" width="640" height="480"></canvas>
</div>
<div id="hint">[ tap the HOT CUP sign to unlock a secret game ]</div>

<div id="game-overlay">
  <div id="game-wrap">
    <button id="close-game" onclick="closeGame()">X</button>
    <canvas id="game" width="480" height="320"></canvas>
    <div id="game-ui">
      <span id="score-display">SCORE: 0</span>
      <span id="shots-display">BALLS: 5</span>
      <span id="msg-display">&nbsp;</span>
    </div>
  </div>
  <div id="instructions">
    ARROW KEYS / TAP = MOVE &nbsp;|&nbsp; SPACE / TAP = THROW<br><br>
    Sink all cups to win!
  </div>
</div>

<footer>
  <p>Built with love and pixels &nbsp;|&nbsp; The Lodge Forever</p>
</footer>

<script>
// ─────────────────────────────────────────
//  PALETTE & PIXEL HELPERS
// ─────────────────────────────────────────
const C = document.getElementById('scene');
const ctx = C.getContext('2d');

function px(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;
  ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h));
}

// ─────────────────────────────────────────
//  PIXEL TEXT RENDERER (3x5 chars)
// ─────────────────────────────────────────
const PIXEL_FONT = {
  'H':['10001','10001','11111','10001','10001'],
  'O':['01110','10001','10001','10001','01110'],
  'T':['11111','00100','00100','00100','00100'],
  'C':['01110','10000','10000','10000','01110'],
  'U':['10001','10001','10001','10001','01110'],
  'P':['11110','10001','11110','10000','10000'],
  ' ':['00000','00000','00000','00000','00000'],
  'S':['01111','10000','01110','00001','11110'],
  'E':['11111','10000','11110','10000','11111'],
  'R':['11110','10001','11110','10100','10011'],
  'A':['01110','10001','11111','10001','10001'],
  'I':['11111','00100','00100','00100','11111'],
  'N':['10001','11001','10101','10011','10001'],
  'G':['01110','10000','10111','10001','01110'],
  'L':['10000','10000','10000','10000','11111'],
  'Y':['10001','01010','00100','00100','00100'],
  'W':['10001','10001','10101','11011','10001'],
  'K':['10001','10010','11100','10010','10001'],
  'D':['11100','10010','10001','10010','11100'],
  'F':['11111','10000','11110','10000','10000'],
  'B':['11110','10001','11110','10001','11110'],
  'M':['10001','11011','10101','10001','10001'],
  'V':['10001','10001','10001','01010','00100'],
  'J':['00111','00010','00010','10010','01100'],
  'X':['10001','01010','00100','01010','10001'],
  'Z':['11111','00010','00100','01000','11111'],
  '!':['00100','00100','00100','00000','00100'],
  ':':['00000','00100','00000','00100','00000'],
  '-':['00000','00000','11111','00000','00000'],
  '.':['00000','00000','00000','00000','00100'],
  '0':['01110','10011','10101','11001','01110'],
  '1':['00100','01100','00100','00100','01110'],
  '2':['01110','10001','00110','01000','11111'],
  '3':['11110','00001','01110','00001','11110'],
  '4':['10001','10001','11111','00001','00001'],
  '5':['11111','10000','11110','00001','11110'],
  '6':['01110','10000','11110','10001','01110'],
  '7':['11111','00001','00010','00100','00100'],
  '8':['01110','10001','01110','10001','01110'],
  '9':['01110','10001','01111','00001','01110'],
};

function drawPixelText(ctx, text, x, y, color, scale) {
  scale = scale || 1;
  var cx = x;
  for (var i = 0; i < text.length; i++) {
    var ch = text[i].toUpperCase();
    var glyph = PIXEL_FONT[ch] || PIXEL_FONT[' '];
    for (var ry = 0; ry < glyph.length; ry++) {
      for (var rx = 0; rx < glyph[ry].length; rx++) {
        if (glyph[ry][rx] === '1') {
          px(ctx, cx + rx * scale, y + ry * scale, scale, scale, color);
        }
      }
    }
    cx += 6 * scale;
  }
}

function lighten(hex, amt) {
  var c = parseInt(hex.slice(1), 16);
  var r = Math.min(255, Math.max(0, (c >> 16) + amt));
  var g = Math.min(255, Math.max(0, ((c >> 8) & 0xff) + amt));
  var b = Math.min(255, Math.max(0, (c & 0xff) + amt));
  return '#' + [r, g, b].map(function(v) { return v.toString(16).padStart(2, '0'); }).join('');
}

// ─────────────────────────────────────────
//  SCENE DRAWING
// ─────────────────────────────────────────

// Store hot-cup sign bounds for click detection
var hotCupRect = null;

function drawScene() {
  var W = 640, H = 480;

  // Sky - sunset gradient
  var sky = ctx.createLinearGradient(0, 0, 0, H * 0.58);
  sky.addColorStop(0,    '#1a0533');
  sky.addColorStop(0.25, '#6b1560');
  sky.addColorStop(0.55, '#e8562a');
  sky.addColorStop(0.8,  '#f9a825');
  sky.addColorStop(1,    '#ffcc44');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Sun glow
  drawSun(ctx, 520, 85, 28);

  // Stars
  var stars = [[40,22],[82,44],[118,14],[205,36],[262,10],[315,27],[352,12],[415,40],[462,18],[558,30],[602,9]];
  stars.forEach(function(s) { px(ctx, s[0], s[1], 2, 2, '#ffffffcc'); });

  // Clouds
  drawCloud(ctx, 55, 55, 4);
  drawCloud(ctx, 275, 38, 3);
  drawCloud(ctx, 448, 68, 3.5);

  // Background hills
  drawHills(ctx, W, H);

  // Trees
  drawTree(ctx, 28, 225, 3);
  drawTree(ctx, 56, 240, 2.5);
  drawTree(ctx, 575, 218, 3);
  drawTree(ctx, 598, 232, 2.5);

  // House
  drawHouse(ctx, 125, 120);

  // Deck surface
  drawDeck(ctx, 95, 325, 450, 75);

  // Ping pong table
  drawPongTable(ctx, 232, 342);

  // Characters
  drawDudes(ctx);

  // Ground
  var grass = ctx.createLinearGradient(0, H * 0.83, 0, H);
  grass.addColorStop(0, '#2d5a1b');
  grass.addColorStop(1, '#1a3a0a');
  ctx.fillStyle = grass;
  ctx.fillRect(0, H * 0.83, W, H * 0.17);
  for (var gx = 0; gx < W; gx += 8) {
    px(ctx, gx, H * 0.83, 1, 4, '#3a7a22');
  }

  // Deck front steps
  px(ctx, 172, 398, 124, 12, '#a07848');
  px(ctx, 182, 410, 104, 10, '#8a6030');

  // HOT CUP sign (drawn last so nothing covers it)
  if (hotCupRect) {
    var sx = hotCupRect.x, sy = hotCupRect.y, sw = hotCupRect.w, sh = hotCupRect.h;
    px(ctx, 312, 398, 2, 6, '#aa8844');  // string
    px(ctx, sx - 2, sy - 2, sw + 4, sh + 4, '#884400');
    px(ctx, sx,     sy,     sw, sh, '#c8a820');
    px(ctx, sx + 1, sy + 1, sw - 2, sh - 2, '#f0d840');
    px(ctx, sx + 2, sy + 2, sw - 4, sh - 4, '#ffe850');
    drawPixelText(ctx, 'HOT CUP', sx + 5, sy + 6, '#8b0000', 2);
  }
}

function drawSun(ctx, x, y, r) {
  var grd = ctx.createRadialGradient(x, y, r * 0.5, x, y, r * 3.5);
  grd.addColorStop(0, '#ffee8866');
  grd.addColorStop(1, 'transparent');
  ctx.fillStyle = grd;
  ctx.beginPath();
  ctx.arc(x, y, r * 3.5, 0, Math.PI * 2);
  ctx.fill();
  // Pixel circle sun
  ctx.fillStyle = '#fff176';
  for (var dy = -r; dy <= r; dy += 2) {
    for (var dx = -r; dx <= r; dx += 2) {
      if (dx * dx + dy * dy <= r * r) {
        ctx.fillRect(x + dx, y + dy, 2, 2);
      }
    }
  }
  // Bright center
  ctx.fillStyle = '#ffffff';
  for (var dy2 = -r*0.4; dy2 <= r*0.4; dy2 += 2) {
    for (var dx2 = -r*0.4; dx2 <= r*0.4; dx2 += 2) {
      if (dx2*dx2+dy2*dy2 <= (r*0.4)*(r*0.4)) ctx.fillRect(x+dx2, y+dy2, 2, 2);
    }
  }
}

function drawCloud(ctx, x, y, scale) {
  var s = Math.round(scale * 2);
  var blocks = [[0,1],[1,0],[1,1],[1,2],[2,0],[2,1],[2,2],[3,1],[4,1],[4,0],[3,0]];
  ctx.fillStyle = '#ffeecc88';
  blocks.forEach(function(b) { ctx.fillRect(x + b[0]*s, y + b[1]*s, s, s); });
}

function drawHills(ctx, W, H) {
  ctx.fillStyle = '#4a2060';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.52);
  ctx.quadraticCurveTo(W * 0.25, H * 0.30, W * 0.5, H * 0.47);
  ctx.quadraticCurveTo(W * 0.75, H * 0.32, W, H * 0.5);
  ctx.lineTo(W, H * 0.56);
  ctx.lineTo(0, H * 0.56);
  ctx.fill();

  ctx.fillStyle = '#1e4a10';
  ctx.beginPath();
  ctx.moveTo(0, H * 0.63);
  ctx.quadraticCurveTo(W * 0.2, H * 0.46, W * 0.45, H * 0.58);
  ctx.quadraticCurveTo(W * 0.7, H * 0.43, W, H * 0.60);
  ctx.lineTo(W, H * 0.70);
  ctx.lineTo(0, H * 0.70);
  ctx.fill();
}

function drawTree(ctx, x, y, scale) {
  var s = Math.round(scale);
  px(ctx, x + s*2, y + s*5, s*2, s*5, '#6b3a1f');
  ctx.fillStyle = '#1a5c0a';
  ctx.fillRect(x, y + s*2, s*6, s*3);
  ctx.fillRect(x + s, y + s, s*4, s*3);
  ctx.fillRect(x + s*2, y, s*2, s*3);
  px(ctx, x + s, y + s, s, s*2, '#2a8a14');
}

function drawHouse(ctx, x, y) {
  // First floor walls
  px(ctx, x, y + 82, 382, 162, '#c8a96e');
  for (var sy = y + 82; sy < y + 244; sy += 10) {
    px(ctx, x, sy, 382, 2, '#b8955a');
  }
  // Corner trim
  px(ctx, x, y + 82, 8, 162, '#a07848');
  px(ctx, x + 374, y + 82, 8, 162, '#a07848');

  // First floor windows
  drawWindow(ctx, x + 28, y + 102, 52, 62);
  drawWindow(ctx, x + 148, y + 102, 52, 62);
  drawWindow(ctx, x + 268, y + 102, 52, 62);

  // Front door
  px(ctx, x + 162, y + 162, 52, 82, '#5a3010');
  px(ctx, x + 166, y + 166, 44, 74, '#6b3a14');
  px(ctx, x + 170, y + 168, 18, 30, '#7a4418');
  px(ctx, x + 192, y + 168, 18, 30, '#7a4418');
  px(ctx, x + 187, y + 198, 6, 6, '#d4a820'); // knob
  px(ctx, x + 160, y + 160, 56, 84, '#a07848'); // frame (draw behind)

  // Second floor
  px(ctx, x + 20, y + 22, 342, 62, '#c8a96e');
  for (var sy2 = y + 22; sy2 < y + 84; sy2 += 10) {
    px(ctx, x + 20, sy2, 342, 2, '#b8955a');
  }
  px(ctx, x + 20, y + 22, 8, 62, '#a07848');
  px(ctx, x + 354, y + 22, 8, 62, '#a07848');

  // Second floor windows
  drawWindow(ctx, x + 58, y + 30, 52, 42);
  drawWindow(ctx, x + 244, y + 30, 52, 42);

  // Center balcony door (second floor)
  px(ctx, x + 152, y + 22, 78, 62, '#5a3010');
  px(ctx, x + 156, y + 26, 34, 54, '#7a4418');
  px(ctx, x + 192, y + 26, 34, 54, '#7a4418');
  px(ctx, x + 188, y + 50, 4, 8, '#d4a820');

  // Eave soffit
  px(ctx, x - 8, y + 20, 400, 8, '#a07848');

  // Roof gable
  ctx.fillStyle = '#4a2d0a';
  ctx.beginPath();
  ctx.moveTo(x - 12, y + 22);
  ctx.lineTo(x + 191, y - 42);
  ctx.lineTo(x + 394, y + 22);
  ctx.closePath();
  ctx.fill();

  // Roof shingles
  ctx.fillStyle = '#3a2008';
  for (var row = 0; row < 5; row++) {
    for (var col = 0; col < 11; col++) {
      ctx.fillRect(x + col*38 - row*3, y + 14 - row*14, 34, 5);
    }
  }
  px(ctx, x + 82, y - 44, 218, 8, '#2a1800');

  // Chimney
  px(ctx, x + 308, y - 62, 32, 52, '#8a5a3a');
  px(ctx, x + 304, y - 68, 40, 10, '#7a4a2a');
}

function drawWindow(ctx, x, y, w, h) {
  px(ctx, x - 4, y - 4, w + 8, h + 8, '#a07848');
  var grd = ctx.createLinearGradient(x, y, x + w, y + h);
  grd.addColorStop(0, '#aaddff66');
  grd.addColorStop(0.5, '#ffeebb33');
  grd.addColorStop(1, '#aaddff66');
  ctx.fillStyle = grd;
  ctx.fillRect(x, y, w, h);
  px(ctx, x + Math.floor(w/2) - 1, y, 2, h, '#ffffff44');
  px(ctx, x, y + Math.floor(h/2) - 1, w, 2, '#ffffff44');
  px(ctx, x + 2, y + 2, 6, 4, '#ffffff33');
}

function drawDeck(ctx, x, y, w, h) {
  var deck = ctx.createLinearGradient(x, y, x, y + h);
  deck.addColorStop(0, '#b8926a');
  deck.addColorStop(1, '#8a6040');
  ctx.fillStyle = deck;
  ctx.fillRect(x, y, w, h);
  for (var bx = x; bx < x + w; bx += 16) {
    px(ctx, bx, y, 1, h, '#9a7050');
  }
  for (var by = y; by < y + h; by += 12) {
    px(ctx, x, by, w, 1, '#9a7050');
  }
  // Railing top
  px(ctx, x, y, w, 8, '#c8a070');
  // Balusters
  for (var bx2 = x + 8; bx2 < x + w - 8; bx2 += 16) {
    px(ctx, bx2, y + 8, 4, h - 14, '#d4b080');
  }
  // Railing bottom
  px(ctx, x, y + h - 6, w, 6, '#c8a070');
}

function drawPongTable(ctx, x, y) {
  var TW = 160, TH = 56, LEG = 26;

  // Legs
  px(ctx, x + 8,       y + TH, 6, LEG, '#555');
  px(ctx, x + TW - 14, y + TH, 6, LEG, '#555');
  px(ctx, x + 8,       y + TH + 12, TW - 16, 3, '#444');

  // Table surface
  px(ctx, x, y, TW, TH, '#1a6622');
  px(ctx, x, y, TW, 3, '#2a9932');
  px(ctx, x, y + TH - 3, TW, 3, '#2a9932');
  px(ctx, x, y, 3, TH, '#2a9932');
  px(ctx, x + TW - 3, y, 3, TH, '#2a9932');
  // Net
  px(ctx, x + TW/2 - 1, y, 2, TH, '#ffffff88');
  for (var ny = y + 4; ny < y + TH; ny += 4) {
    px(ctx, x + TW/2 - 6, ny, 12, 1, '#ffffff22');
  }

  // Red cups — opponent side (far): triangle of 6, rotated 90° CCW (base on left, apex right)
  var ox = x + 12, oy = y + 5;
  var cups_opp = [
    [ox,      oy],
    [ox,      oy + 12],
    [ox,      oy + 24],
    [ox + 13, oy + 6],
    [ox + 13, oy + 18],
    [ox + 26, oy + 12],
  ];
  cups_opp.forEach(function(c) { drawCupAt(ctx, c[0], c[1]); });

  // Red cups — player side: triangle of 6, rotated 90° CCW (apex left, base on right)
  var px2 = x + TW - 44, py2 = y + TH - 35;
  var cups_pl = [
    [px2 + 26, py2],
    [px2 + 26, py2 + 12],
    [px2 + 26, py2 + 24],
    [px2 + 13, py2 + 6],
    [px2 + 13, py2 + 18],
    [px2,      py2 + 12],
  ];
  cups_pl.forEach(function(c) { drawCupAt(ctx, c[0], c[1]); });

  // HOT CUP sign — store bounds; drawn last in drawScene so ground doesn't cover it
  var sw = 84, sh = 26;
  var sx = x + TW/2 - sw/2, sy = y + TH + 4;
  hotCupRect = { x: sx, y: sy, w: sw, h: sh };
}

function drawCupAt(ctx, x, y) {
  px(ctx, x, y, 12, 9, '#cc2222');
  px(ctx, x + 1, y, 10, 3, '#ff5555');
  px(ctx, x + 1, y + 7, 10, 2, '#aa1111');
  px(ctx, x + 4, y + 2, 2, 2, '#ff9999');
}

function drawDudes(ctx) {
  // Left to right across the deck, in front of the table
  drawDude(ctx, 112, 332, '#f5d5b0', '#3366cc', '#334488', false, '#221100');  // white, blue shirt
  drawDude(ctx, 200, 330, '#f0c8a0', '#cc3322', '#882211', false, null);       // white, red shirt (bald)
  drawDude(ctx, 408, 329, '#7a4828', '#228844', '#115522', true,  '#110500');  // Sri Lankan, green
  drawDude(ctx, 492, 332, '#f2cfa8', '#ddaa22', '#997711', false, '#994400');  // white, orange hair
}

function drawDude(ctx, x, y, skin, shirt, pants, isSriLankan, hairColor) {
  // Shadow
  ctx.fillStyle = '#00000033';
  ctx.beginPath();
  ctx.ellipse(x + 12, y + 62, 14, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  // Legs
  px(ctx, x + 4,  y + 40, 8, 20, pants);
  px(ctx, x + 14, y + 40, 8, 20, pants);
  // Shoes
  px(ctx, x + 2,  y + 58, 12, 6, '#221100');
  px(ctx, x + 14, y + 58, 12, 6, '#221100');

  // Body
  px(ctx, x + 2, y + 20, 22, 22, shirt);
  px(ctx, x + 4, y + 22, 7, 4, lighten(shirt, 35));
  px(ctx, x + 9, y + 20, 8, 3, lighten(shirt, 15));

  // Left arm (relaxed)
  px(ctx, x - 4, y + 22, 8, 14, skin);
  px(ctx, x - 4, y + 22, 7, 3, shirt);
  px(ctx, x - 5, y + 34, 9, 7, skin);

  // Right arm (slightly raised / waving)
  px(ctx, x + 22, y + 18, 8, 14, skin);
  px(ctx, x + 22, y + 18, 7, 3, shirt);
  px(ctx, x + 22, y + 30, 9, 7, skin);

  // Neck
  px(ctx, x + 10, y + 14, 6, 8, skin);

  // Head
  px(ctx, x + 2,  y - 2,  22, 22, skin);
  px(ctx, x + 5,  y,      7,  4,  lighten(skin, 18));

  // Ears
  px(ctx, x,      y + 7,  4, 6, skin);
  px(ctx, x + 22, y + 7,  4, 6, skin);
  if (isSriLankan) {
    px(ctx, x + 1,  y + 8, 2, 4, lighten(skin, -10));
    px(ctx, x + 23, y + 8, 2, 4, lighten(skin, -10));
  }

  // Eyes smiling
  px(ctx, x + 6,  y + 6, 4, 3, '#221100');
  px(ctx, x + 15, y + 6, 4, 3, '#221100');
  px(ctx, x + 7,  y + 6, 2, 1, '#fff');
  px(ctx, x + 16, y + 6, 2, 1, '#fff');

  // Smile mouth
  px(ctx, x + 5,  y + 14, 2, 2, '#cc5533');
  px(ctx, x + 7,  y + 16, 10, 2, '#cc5533');
  px(ctx, x + 17, y + 14, 2, 2, '#cc5533');
  px(ctx, x + 6,  y + 15, 2, 2, '#ff9977');
  px(ctx, x + 13, y + 15, 2, 2, '#ff9977');

  // Hair
  if (hairColor) {
    px(ctx, x + 2,  y - 2, 22, 5, hairColor);
    px(ctx, x + 2,  y - 2, 3, 12, hairColor);
    px(ctx, x + 21, y - 2, 3, 12, hairColor);
    if (isSriLankan) {
      px(ctx, x + 2, y - 4, 22, 4, hairColor);
    }
  }
}

// Draw scene
drawScene();

// ─────────────────────────────────────────
//  HOT CUP CLICK / HOVER
// ─────────────────────────────────────────
C.addEventListener('click', function(e) {
  var rect = C.getBoundingClientRect();
  var scaleX = C.width / rect.width;
  var scaleY = C.height / rect.height;
  var mx = (e.clientX - rect.left) * scaleX;
  var my = (e.clientY - rect.top)  * scaleY;
  if (hotCupRect &&
      mx >= hotCupRect.x - 6 && mx <= hotCupRect.x + hotCupRect.w + 6 &&
      my >= hotCupRect.y - 6 && my <= hotCupRect.y + hotCupRect.h + 6) {
    openGame();
  }
});

C.addEventListener('mousemove', function(e) {
  var rect = C.getBoundingClientRect();
  var scaleX = C.width / rect.width;
  var scaleY = C.height / rect.height;
  var mx = (e.clientX - rect.left) * scaleX;
  var my = (e.clientY - rect.top)  * scaleY;
  if (hotCupRect &&
      mx >= hotCupRect.x - 6 && mx <= hotCupRect.x + hotCupRect.w + 6 &&
      my >= hotCupRect.y - 6 && my <= hotCupRect.y + hotCupRect.h + 6) {
    C.style.cursor = 'pointer';
  } else {
    C.style.cursor = 'default';
  }
});

// ═══════════════════════════════════════════════════════
//  BEER PONG MINI-GAME
// ═══════════════════════════════════════════════════════
var GC = document.getElementById('game');
var gctx = GC.getContext('2d');
var GW = GC.width, GH = GC.height;
var gameState = null;

function openGame() {
  document.getElementById('game-overlay').classList.add('active');
  initGame();
}

function closeGame() {
  document.getElementById('game-overlay').classList.remove('active');
  if (gameState) { gameState.running = false; gameState = null; }
}

function initGame() {
  if (gameState) { gameState.running = false; }

  // Opponent cups — triangle at top, 6 cups
  var oppCups = [];
  var ox = 160, oy = 28;
  var oppLayout = [[0,0],[1,0],[2,0],[0,1],[1,1],[0,2]];
  oppLayout.forEach(function(c) {
    oppCups.push({ x: ox + c[0]*22, y: oy + c[1]*22, hit: false });
  });

  // Player cups — triangle at bottom
  var plCups = [];
  var plx = 240, ply = GH - 72;
  var plLayout = [[0,0],[1,0],[2,0],[0,-1],[1,-1],[0,-2]];
  plLayout.forEach(function(c) {
    plCups.push({ x: plx + c[0]*22, y: ply + c[1]*22, hit: false });
  });

  gameState = {
    running: true,
    score: 0,
    balls: 5,
    playerX: GW/2 - 10,
    playerVX: 0,
    ball: null,
    oppCups: oppCups,
    plCups: plCups,
    particles: [],
    msg: '',
    msgTimer: 0,
    phase: 'play',
    animFrame: 0,
    keys: {}
  };

  document.addEventListener('keydown', gameKeyDown);
  document.addEventListener('keyup', gameKeyUp);
  GC.addEventListener('click', gameCanvasClick);
  GC.addEventListener('touchstart', gameTouchStart, { passive: false });

  updateGameUI();
  requestAnimationFrame(gameLoop);
}

function gameKeyDown(e) {
  if (!gameState) return;
  gameState.keys[e.code] = true;
  if (e.code === 'Space') { e.preventDefault(); throwBall(); }
}
function gameKeyUp(e) {
  if (gameState) gameState.keys[e.code] = false;
}

function gameCanvasClick(e) {
  if (!gameState) return;
  // If end-screen, check replay
  if (gameState.phase !== 'play') {
    var r = GC.getBoundingClientRect();
    var mx = (e.clientX - r.left) * (GW / r.width);
    var my = (e.clientY - r.top)  * (GH / r.height);
    if (mx > GW/2 - 70 && mx < GW/2 + 70 && my > GH - 55 && my < GH - 26) {
      initGame();
      return;
    }
  }
  throwBall();
}

function gameTouchStart(e) {
  e.preventDefault();
  if (!gameState) return;
  if (gameState.phase !== 'play') {
    gameCanvasClick(e.touches[0]);
    return;
  }
  var r = GC.getBoundingClientRect();
  var tx = (e.touches[0].clientX - r.left) * (GW / r.width);
  if (tx < GW / 3) {
    gameState.keys['ArrowLeft'] = true;
    setTimeout(function() { if (gameState) gameState.keys['ArrowLeft'] = false; }, 200);
  } else if (tx > GW * 2/3) {
    gameState.keys['ArrowRight'] = true;
    setTimeout(function() { if (gameState) gameState.keys['ArrowRight'] = false; }, 200);
  }
  throwBall();
}

var _lastGameLoopId = 0;
function gameLoop() {
  var gs = gameState;
  if (!gs || !gs.running) return;
  gs.animFrame++;
  updateGame(gs);
  renderGame(gs);
  if (gs.running) requestAnimationFrame(gameLoop);
}

function updateGame(gs) {
  if (gs.phase === 'play') {
    // Move player
    if (gs.keys['ArrowLeft'])  gs.playerVX -= 1.5;
    if (gs.keys['ArrowRight']) gs.playerVX += 1.5;
    gs.playerVX *= 0.7;
    gs.playerX += gs.playerVX;
    gs.playerX = Math.max(8, Math.min(GW - 36, gs.playerX));

    // Move ball
    if (gs.ball && gs.ball.active) {
      gs.ball.x += gs.ball.vx;
      gs.ball.y += gs.ball.vy;
      gs.ball.vy += 0.22; // gravity

      // Check cup collisions
      var hit = false;
      gs.oppCups.forEach(function(cup) {
        if (cup.hit || hit) return;
        if (gs.ball.x + 4 > cup.x && gs.ball.x - 4 < cup.x + 14 &&
            gs.ball.y + 4 > cup.y && gs.ball.y - 4 < cup.y + 14) {
          cup.hit = true;
          gs.ball.active = false;
          gs.score += 100;
          gs.msg = 'NICE SHOT!';
          gs.msgTimer = 70;
          spawnParticles(gs, cup.x + 7, cup.y + 6);
          hit = true;
          updateGameUI();
          checkEndCondition(gs);
        }
      });

      // Out of bounds
      if (!hit && gs.ball.active &&
          (gs.ball.y > GH + 30 || gs.ball.y < -50 || gs.ball.x < -30 || gs.ball.x > GW + 30)) {
        gs.ball.active = false;
        gs.ball = null;
        checkEndCondition(gs);
      }
    }
  }

  // Particles
  gs.particles = gs.particles.filter(function(p) { return p.life > 0; });
  gs.particles.forEach(function(p) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--;
  });

  if (gs.msgTimer > 0) gs.msgTimer--;
}

function checkEndCondition(gs) {
  if (gs.oppCups.every(function(c) { return c.hit; })) {
    gs.phase = 'win';
    gs.score += gs.balls * 50;
    gs.msg = 'YOU WIN!';
    gs.msgTimer = 999;
    updateGameUI();
  } else if (gs.balls === 0 && (!gs.ball || !gs.ball.active)) {
    gs.phase = 'lose';
    gs.msg = 'GAME OVER';
    gs.msgTimer = 999;
    updateGameUI();
  }
}

function throwBall() {
  var gs = gameState;
  if (!gs || gs.phase !== 'play') return;
  if (gs.ball && gs.ball.active) return;
  if (gs.balls <= 0) return;

  var startX = gs.playerX + 11;
  var startY = GH - 108;

  // Pick a target cup (random from remaining)
  var targets = gs.oppCups.filter(function(c) { return !c.hit; });
  if (!targets.length) return;
  var target = targets[Math.floor(Math.random() * targets.length)];

  // Add some random spread — skill based
  var spread = (Math.random() - 0.5) * 40;
  var tx = target.x + 7 + spread;
  var ty = target.y + 5;

  var frames = 30;
  var dx = tx - startX;
  var dy = ty - startY;
  // Account for gravity: y = startY + vy*t + 0.5*g*t^2, solve for vy
  var g = 0.22;
  var vy = (dy - 0.5 * g * frames * frames) / frames;
  var vx = dx / frames;

  gs.balls--;
  gs.ball = { x: startX, y: startY, vx: vx, vy: vy, active: true };
  updateGameUI();
}

function spawnParticles(gs, x, y) {
  for (var i = 0; i < 12; i++) {
    var angle = Math.random() * Math.PI * 2;
    var speed = 1.5 + Math.random() * 3.5;
    var colors = ['#cc2222','#ff5555','#ffdd57','#ffffff','#ff9900'];
    gs.particles.push({
      x: x, y: y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 35,
      color: colors[Math.floor(Math.random() * colors.length)]
    });
  }
}

function renderGame(gs) {
  // Background
  var bg = gctx.createLinearGradient(0, 0, 0, GH);
  bg.addColorStop(0, '#1a0f28');
  bg.addColorStop(1, '#2a1808');
  gctx.fillStyle = bg;
  gctx.fillRect(0, 0, GW, GH);

  // Wall paneling
  gctx.fillStyle = '#22143a';
  for (var wx = 0; wx < GW; wx += 40) {
    gctx.fillRect(wx, 0, 1, GH * 0.55);
  }

  // Table
  var ty = GH * 0.38;
  var tw = GW - 40;
  px(gctx, 20, ty, tw, 64, '#1a6622');
  px(gctx, 20, ty, tw, 3, '#2a9932');
  px(gctx, 20, ty + 61, tw, 3, '#2a9932');
  px(gctx, 20, ty, 3, 64, '#2a9932');
  px(gctx, GW - 23, ty, 3, 64, '#2a9932');
  // Center line / net
  px(gctx, GW/2 - 1, ty, 2, 64, '#ffffff88');
  for (var ny = ty + 4; ny < ty + 64; ny += 4) {
    px(gctx, GW/2 - 8, ny, 16, 1, '#ffffff22');
  }

  // Table legs
  px(gctx, 28,      ty + 64, 6, 28, '#555');
  px(gctx, GW - 34, ty + 64, 6, 28, '#555');
  px(gctx, 28,      ty + 74, GW - 60, 3, '#444');

  // Floor
  px(gctx, 0, ty + 92, GW, GH - ty - 92, '#3a2010');
  gctx.fillStyle = '#4a2a14';
  for (var fx = 0; fx < GW; fx += 20) { gctx.fillRect(fx, ty + 92, 1, GH - ty - 92); }
  for (var fy = ty + 92; fy < GH; fy += 20) { gctx.fillRect(0, fy, GW, 1); }

  // Opponent cups
  gs.oppCups.forEach(function(c) {
    if (c.hit) {
      // empty ring
      gctx.strokeStyle = '#11551144';
      gctx.lineWidth = 1;
      gctx.strokeRect(c.x + 1, c.y + 1, 12, 8);
      return;
    }
    px(gctx, c.x, c.y, 14, 10, '#cc2222');
    px(gctx, c.x + 2, c.y, 10, 3, '#ff5555');
    px(gctx, c.x + 1, c.y + 8, 12, 2, '#aa1111');
    px(gctx, c.x + 4, c.y + 2, 3, 2, '#ff9999');
  });

  // Player side cups
  gs.plCups.forEach(function(c) {
    px(gctx, c.x, c.y, 14, 10, '#2255bb');
    px(gctx, c.x + 2, c.y, 10, 3, '#4477ff');
    px(gctx, c.x + 1, c.y + 8, 12, 2, '#113399');
    px(gctx, c.x + 4, c.y + 2, 3, 2, '#88aaff');
  });

  // Player character
  drawGameDude(gctx, gs.playerX, GH - 112);

  // Aim dotted line (when no ball in flight)
  if (gs.phase === 'play' && (!gs.ball || !gs.ball.active) && gs.balls > 0) {
    var targets = gs.oppCups.filter(function(c) { return !c.hit; });
    if (targets.length) {
      var t = targets[0];
      gctx.setLineDash([3, 4]);
      gctx.strokeStyle = '#ffffff22';
      gctx.lineWidth = 1;
      gctx.beginPath();
      gctx.moveTo(gs.playerX + 11, GH - 108);
      gctx.lineTo(t.x + 7, t.y + 5);
      gctx.stroke();
      gctx.setLineDash([]);
    }
  }

  // Ball in flight
  if (gs.ball && gs.ball.active) {
    gctx.fillStyle = '#f0f0f0';
    gctx.beginPath();
    gctx.arc(gs.ball.x, gs.ball.y, 5, 0, Math.PI * 2);
    gctx.fill();
    gctx.fillStyle = '#cccccc';
    gctx.beginPath();
    gctx.arc(gs.ball.x - 1, gs.ball.y - 1, 2, 0, Math.PI * 2);
    gctx.fill();
  }

  // Particles
  gs.particles.forEach(function(p) {
    gctx.fillStyle = p.color;
    gctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  });

  // Message
  if (gs.msgTimer > 0 && gs.phase === 'play') {
    gctx.fillStyle = '#00000099';
    gctx.fillRect(GW/2 - 80, GH/2 - 20, 160, 32);
    drawPixelText(gctx, gs.msg, GW/2 - gs.msg.length * 4, GH/2 - 14, '#ffdd57', 2);
  }

  // End screen
  if (gs.phase === 'win' || gs.phase === 'lose') {
    gctx.fillStyle = '#000000bb';
    gctx.fillRect(0, 0, GW, GH);

    var title = gs.phase === 'win' ? 'YOU WIN!' : 'GAME OVER';
    var titleColor = gs.phase === 'win' ? '#ffdd57' : '#ff4444';
    drawPixelText(gctx, title, GW/2 - title.length * 5, GH/2 - 40, titleColor, 3);

    var scoreStr = 'SCORE: ' + gs.score;
    drawPixelText(gctx, scoreStr, GW/2 - scoreStr.length * 3, GH/2 + 10, '#ffffff', 2);

    // Replay button
    gctx.fillStyle = '#224422';
    gctx.fillRect(GW/2 - 70, GH - 55, 140, 28);
    gctx.strokeStyle = '#44aa44';
    gctx.lineWidth = 2;
    gctx.strokeRect(GW/2 - 70, GH - 55, 140, 28);
    drawPixelText(gctx, 'PLAY AGAIN', GW/2 - 30, GH - 48, '#88ff88', 1);
  }

  // HUD cups remaining
  var remaining = gs.oppCups.filter(function(c) { return !c.hit; }).length;
  drawPixelText(gctx, 'CUPS: ' + remaining, 8, 8, '#aaddff', 1);
}

function drawGameDude(ctx, x, y) {
  // Mini dude (character 1 — blue shirt)
  var skin = '#f5d5b0', shirt = '#3366cc', pants = '#334488';
  // shadow
  ctx.fillStyle = '#00000033';
  ctx.beginPath();
  ctx.ellipse(x + 11, y + 44, 10, 3, 0, 0, Math.PI * 2);
  ctx.fill();
  // legs
  px(ctx, x + 3,  y + 30, 6, 12, pants);
  px(ctx, x + 11, y + 30, 6, 12, pants);
  // shoes
  px(ctx, x + 1,  y + 40, 8, 5, '#221100');
  px(ctx, x + 11, y + 40, 8, 5, '#221100');
  // body
  px(ctx, x + 1, y + 14, 20, 18, shirt);
  // arms
  px(ctx, x - 4, y + 16, 7, 10, skin);
  px(ctx, x - 4, y + 16, 6, 3, shirt);
  px(ctx, x + 19, y + 12, 7, 10, skin);
  px(ctx, x + 19, y + 12, 6, 3, shirt);
  // neck
  px(ctx, x + 8, y + 10, 6, 6, skin);
  // head
  px(ctx, x + 2, y, 18, 14, skin);
  // hair
  px(ctx, x + 2, y, 18, 4, '#221100');
  px(ctx, x + 2, y, 3, 10, '#221100');
  px(ctx, x + 17, y, 3, 10, '#221100');
  // eyes
  px(ctx, x + 5,  y + 5, 3, 2, '#221100');
  px(ctx, x + 13, y + 5, 3, 2, '#221100');
  px(ctx, x + 5,  y + 5, 1, 1, '#fff');
  px(ctx, x + 14, y + 5, 1, 1, '#fff');
  // smile
  px(ctx, x + 5,  y + 9, 2, 2, '#cc5533');
  px(ctx, x + 7,  y + 11, 8, 2, '#cc5533');
  px(ctx, x + 15, y + 9, 2, 2, '#cc5533');
}

function updateGameUI() {
  if (!gameState) return;
  document.getElementById('score-display').textContent = 'SCORE: ' + gameState.score;
  document.getElementById('shots-display').textContent = 'BALLS: ' + gameState.balls;
}
</script>
